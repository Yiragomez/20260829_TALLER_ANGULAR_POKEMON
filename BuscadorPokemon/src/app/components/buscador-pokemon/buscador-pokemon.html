<section class="buscador-container">
  <h2>Buscar Pokémon</h2>
  <p>Consulta un Pokémon y regístralo en tu equipo.</p>

  <form (ngSubmit)="buscarPokemon()">
    <label for="nombrePokemon">Nombre o número</label>
    <input
      id="nombrePokemon"
      name="nombrePokemon"
      type="text"
      [ngModel]="nombrePokemonInput()"
      (ngModelChange)="nombrePokemonInput.set($event)"
      placeholder="Ejemplo: pikachu o 25"
      required
    />
    <button type="submit" [disabled]="cargando()">
      {{ cargando() ? 'Buscando...' : 'Buscar' }}
    </button>
  </form>

  @if (mensajeError(); as error) {
    <p role="alert">{{ error }}</p>
  }

  @if (pokemon(); as poke) {
    <article class="card-pokemon">
      <img [src]="poke.image" [alt]="poke.name" />
      <h3>{{ poke.name }}</h3>
      <p>Tipo: <span class="badge-tipo">{{ poke.type }}</span></p>
      <button class="btn-guardar" type="button" (click)="guardarEnEquipo()">
        ALMACENAR EN INVENTARIO
      </button>
    </article>
  }
</section>
